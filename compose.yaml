services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dainiki
      POSTGRES_PASSWORD: dainiki
      POSTGRES_DB: dainiki
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dainiki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dainiki -d dainiki"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  dainiki-postgres:
