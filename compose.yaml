services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: dainiki
      POSTGRES_PASSWORD: dainiki
      POSTGRES_DB: dainiki
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dainiki-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dainiki -d dainiki"]
      interval: 2s
      timeout: 3s
      retries: 20

  app:
    build: .
    profiles: ["full"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://dainiki:dainiki@db:5432/dainiki
      APP_BASE_URL: http://127.0.0.1:3000
      AUTH_EMAIL_MODE: file
      MAIL_OUTBOX_DIR: /app/data/outbox
      BILLING_MODE: mock
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - dainiki-outbox:/app/data/outbox
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  dainiki-postgres:
  dainiki-outbox:
