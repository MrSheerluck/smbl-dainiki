[package]
name = "dainiki-client"
version = "0.1.0"
edition = "2024"
publish = false
description = "Browser client for Dainiki"
license = "MIT"
repository = "https://github.com/MrSheerluck/smbl-dainiki"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
dainiki-core = { path = "../core" }
console_error_panic_hook = "0.1"
gloo-timers = "0.3"
js-sys = "0.3"
time = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "ClipboardEvent",
    "DataTransfer",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "InputEvent",
    "KeyboardEvent",
    "MediaQueryList",
    "Navigator",
    "Node",
    "Range",
    "Selection",
    "ServiceWorkerContainer",
    "Storage",
    "StorageManager",
    "Url",
    "Window",
    "WritableStream",
    "console",
] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
gloo-net = "0.7.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
diffy = "0.5.2"
