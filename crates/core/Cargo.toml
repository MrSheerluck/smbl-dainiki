[package]
name = "dainiki-core"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = { version = "0.6", default-features = false, features = ["alloc", "getrandom"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11"
time = { version = "0.3", features = ["macros", "parsing"] }
zeroize = "1.9.1"
