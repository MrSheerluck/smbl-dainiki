[package]
name = "dainiki-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
topcoat = { version = "0.10.0", features = ["tailwind", "fs"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "tls-rustls-ring"] }
argon2 = "0.6"
serde = { version = "1.0.229", features = ["derive"] }
dotenvy = "0.15.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1.0.154"
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.22"
hmac = "0.13"
time = { version = "0.3.55", features = ["parsing", "formatting"] }

[build-dependencies]
topcoat = { version = "0.10.0", default-features = false, features = ["tailwind"] }
