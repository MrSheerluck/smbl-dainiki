name: smbl-shared

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smbl
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/smbl/.env}
      DAINIKI_DB_PASSWORD: ${DAINIKI_DB_PASSWORD:?set DAINIKI_DB_PASSWORD in /opt/smbl/.env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      db:
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smbl"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    networks:
      edge:
    depends_on:
      - caddy
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  edge:
    name: smbl_edge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  db:
    name: smbl_db
    internal: true
    ipam:
      config:
        - subnet: 172.31.0.0/24

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
